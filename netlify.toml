# Site + functions are both served from Netlify (hangman-cipher.netlify.app)
#
# 1. Connect repo to Netlify, it auto-detects netlify.toml
# 2. Set env var in Netlify dashboard: LLM_API_KEY (Groq API key)
# 3. cipher-hangman.html calls the function by a relative path:
#    /.netlify/functions/generate-themed-phrase
#
# Uses Groq (qwen/qwen3.8-27b) - fast, free tier

[build]
  # No publish directory = no static hosting
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["**/*.js"]