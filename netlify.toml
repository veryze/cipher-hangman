# Deploy ONLY functions to Netlify (static site stays on GitHub Pages)
# 
# 1. Connect repo to Netlify, it auto-detects netlify.toml
# 2. Set env var in Netlify dashboard: LLM_API_KEY (Groq API key)
# 3. Update cipher-hangman.html fetch URL to: https://YOUR-SITE.netlify.app/.netlify/functions/generate-phrase
# 
# Uses Groq (llama-3.1-8b-instant) - fast, free tier

[build]
  # No publish directory = no static hosting
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["**/*.js"]